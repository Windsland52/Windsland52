name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at 08:00 Beijing time
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          # nord_bright palette to match the summary-cards theme
          options: username=${{ github.repository_owner }}&show_icons=true&title_color=3b4252&icon_color=88c0d0&text_color=2e3440&bg_color=eceff4&border_color=e5e9f0
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 8
          THEME: nord_bright
          AUTO_PUSH: false
          ANIMATION: rise

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#88c0d0&color_dots=#e5e9f0,#88c0d0,#81a1c1,#5e81ac,#2e3440

      - name: Collect cards
        run: |
          mkdir -p profile
          cp profile-summary-card-output/nord_bright/4-productive-time.svg profile/productive-time.svg
          cp profile-summary-card-output/nord_bright/0-profile-details.svg profile/profile-details.svg || echo "profile-details card not generated (skipped)"
          cp dist/snake.svg profile/snake.svg
          git rm --cached --ignore-unmatch profile/top-langs.svg profile/pin-readme-tools-github-readme-stats.svg
          rm -f profile/top-langs.svg profile/pin-readme-tools-github-readme-stats.svg

      - name: Validate generated cards
        run: |
          if grep -REq "Something went wrong|Resource not accessible by integration|rate limit" profile/*.svg; then
            echo "::error::Card generation returned an error SVG"
            exit 1
          fi

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile
          if git diff --staged --quiet; then
            echo "No card changes to commit"
          else
            git commit -m "Update README cards"
            git push
          fi
